name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: make test

      - name: Vet
        run: make vet

      - name: Build (linux targets)
        run: |
          make build-linux-x64
          make build-linux-arm

      - name: Upload dist (Forgejo generic package)
        env:
          FORGEJO_SERVER_URL: ${{ forgejo.server_url }}
          FORGEJO_REPOSITORY_OWNER: ${{ forgejo.repository_owner }}
          FORGEJO_ACTOR: ${{ forgejo.actor }}
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          FORGEJO_SHA: ${{ forgejo.sha }}
        run: |
          tar -czf dist.tar.gz -C dist .
          curl --fail --show-error --location \
            --user "${FORGEJO_ACTOR}:${FORGEJO_TOKEN}" \
            --upload-file dist.tar.gz \
            "${FORGEJO_SERVER_URL}/api/packages/${FORGEJO_REPOSITORY_OWNER}/generic/iwatch/${FORGEJO_SHA}/dist.tar.gz"
